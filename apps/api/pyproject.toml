[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "trucksafe-api"
version = "0.1.0"
description = "Django API for weather-aware truck routing."
requires-python = ">=3.11"

dependencies = ["Django>=4.2,<5.0", "djangorestframework>=3.15,<4.0"]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["config", "config.*", "risk", "risk.*", "routing", "routing.*"]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["config/tests", "risk/tests", "routing/tests"]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
